<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberGear Emporium</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="header-content">
            <h1>CyberGear Emporium</h1>
            <p>Your one-stop shop for next-gen tech.</p>
        </div>
    </header>

    <main>
        <section id="error-message" class="hidden">
            <!-- Errors will be displayed here -->
        </section>
        
        <section id="product-grid" class="grid">
            <!-- Products will be injected here via JavaScript -->
            <div class="loading">Loading hardware catalog...</div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 CyberGear Emporium. All systems operational.</p>
    </footer>

    <script src="app.js" type="module"></script>
</body>
</html>
